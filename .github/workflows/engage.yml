name: Engage list (read-only)
on:
  # 자동 실행 꺼 둠: 앱에 business_discovery·해시태그 검색 권한이 없어 (#10) 오류. 권한 생기면 schedule 다시 켜기
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/engage-run']
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - name: Collect candidate posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 reels/engage.py
      - name: Commit
        run: |
          git config user.name "gymbasecamp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reels/engage
          git diff --cached --quiet || (git commit -m "소통 리스트 후보 $(date -u +%F)" && git pull --rebase -q && git push)
