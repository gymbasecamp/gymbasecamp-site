name: IG insights (read-only)
on:
  # 2026-11-27 재가동 (11/23 중지 → 지훈 지시 "자동 업로드 다시 진행, 전날 23시 점검 OK 한 것만") — 승인 안 된 큐는 publish.py가 건너뜀
  schedule:
    - cron: '41 22 * * *'   # 매일 07:41 KST 무렵(지연 감안)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/insights-run']
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN_LONG || secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 reels/insights.py && python3 reels/ledger.py
      - run: |
          git config user.name "gymbasecamp-bot"; git config user.email "actions@users.noreply.github.com"
          git add reels/insights && git commit -m "인스타 성과 수집" && (git push || (git pull --rebase && git push)) || true
