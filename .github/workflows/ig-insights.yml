name: IG insights (read-only)
on:
  schedule:
    - cron: '41 22 * * *'   # 매일 07:41 KST 무렵(지연 감안)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/insights-run']
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 reels/insights.py
      - run: |
          git config user.name "gymbasecamp-bot"; git config user.email "actions@users.noreply.github.com"
          git add reels/insights && git commit -m "인스타 성과 수집" && (git push || (git pull --rebase && git push)) || true
