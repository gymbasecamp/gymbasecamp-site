name: Reels auto publish
on:
  # 2026-11-27 재가동 (11/23 중지 → 지훈 지시 "자동 업로드 다시 진행, 전날 23시 점검 OK 한 것만") — 승인 안 된 큐는 publish.py가 건너뜀
  schedule:
    - cron: '17 11 * * *'     # 매일 20:17 KST 예약 → GitHub 지연(약 45분) 감안해 실제 21:00 전후 게시 (2026-11-20: 팔로워 활동 최고 21~24시 — 인사이트 기준)
    - cron: '47 2 * * *'      # 매일 11:47 KST 예약 → 실제 12:30~12:40 점심 게시물(월·수·금 카드뉴스, 그 외 짧은 릴스)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/publish-run']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - name: Publish today's reel
        env:
          # 2026-11-27 원인 확인: 장기 토큰(IG_TOKEN_LONG)으로는 릴스 게시가 2207085로 실패, 예전 토큰(IG_TOKEN)으로는 성공 → 게시는 예전 토큰 우선 (성과 수집은 IG_TOKEN_LONG 그대로)
          IG_TOKEN: ${{ secrets.IG_TOKEN || secrets.IG_TOKEN_LONG }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -s .github/publish-date ] && [ "${{ github.event_name }}" = "push" ]; then export PUBLISH_DATE=$(cat .github/publish-date); [ -s .github/publish-kind ] && export PUBLISH_KIND=$(cat .github/publish-kind); fi
          case "${{ github.event.schedule }}" in "47 2 * * *") export PUBLISH_KIND=card;; "") ;; *) export PUBLISH_KIND=reel;; esac
          python3 reels/publish.py
      - name: Commit log
        run: |
          git config user.name "gymbasecamp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A reels
          git diff --cached --quiet || (git commit -m "릴스 업로드 기록 $(date -u +%F)" && git push)
