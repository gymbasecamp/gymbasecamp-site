name: Reels auto publish
on:
  schedule:
    - cron: '47 9 * * 1-5'    # 평일 18:47 KST 예약 → GitHub 지연(약 50분) 감안해 실제 19:30~19:40 게시
    - cron: '47 0 * * 0,6'    # 주말 09:47 KST 예약 → 실제 10:30~10:40 게시
    - cron: '47 2 * * *'      # 매일 11:47 KST 예약 → 실제 12:30~12:40 점심 게시물(월·수·금 카드뉴스, 그 외 짧은 릴스)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/publish-run']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - name: Publish today's reel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -s .github/publish-date ] && [ "${{ github.event_name }}" = "push" ]; then export PUBLISH_DATE=$(cat .github/publish-date); [ -s .github/publish-kind ] && export PUBLISH_KIND=$(cat .github/publish-kind); fi
          case "${{ github.event.schedule }}" in "47 2 * * *") export PUBLISH_KIND=card;; "") ;; *) export PUBLISH_KIND=reel;; esac
          python3 reels/publish.py
      - name: Commit log
        run: |
          git config user.name "gymbasecamp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A reels
          git diff --cached --quiet || (git commit -m "릴스 업로드 기록 $(date -u +%F)" && git push)
