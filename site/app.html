function priceTxt(s){
  if(lang!=='en') return s;
  if(s.includes('상품별 상이')) return 'Varies by product';
  let p=s.split('(')[0].replace(/의류\s*/,'').replace(/약\s*/,'approx. ');
  p=p.replace(/(\d+(?:\.\d+)?)만/g,(m,n)=>'₩'+Math.round(parseFloat(n)*10000).toLocaleString('en-US'));
  p=p.replace(/원대|원/g,'').replace(/전후부터/,' and up').replace(/부터/,' and up').replace(/대\+?/,m=>m.includes('+')?'+':'').replace(/~/g,'–');
  return p.replace(/\s+/g,' ').trim();
}

/* Analytics hook: pushes to GA4/GTM dataLayer once the WordPress site loads a tag. */
function track(event, params){
  const p=Object.assign({lang},params||{});
  try{ if(typeof window.gtag==='function'){ window.gtag('event', event, p); } else { (window.dataLayer=window.dataLayer||[]).push(Object.assign({event},p)); } }catch(e){}

const norm = s => String(s??'').toLowerCase().replace(/[\s\-_.·\/,'’&()]/g,'');

function hayOf(b){
  if(b._hay) return b._hay;
  const en=(b.style+','+b.vibe+','+b.sport+','+(b.f||[]).join(',')).split(/[,·\/]/).map(x=>TOK[x.trim()]||'').join(' ');
  return b._hay=norm([b.style,b.items,b.vibe,b.sport,b.type,b.buy,b.origin,(b.f||[]).join(' '),b.desc,b.descEn,en,b.price].join(' '));
}
function searchBrands(q){
  const n=norm(q); if(!n) return [];
  const out=[];
  for(const b of BRANDS){
    const ne=norm(b.en), nk=norm(b.ko); let sc=0;
    if(ne===n||nk===n) sc=300; else if(ne.startsWith(n)||nk.startsWith(n)) sc=200; else if(ne.includes(n)||nk.includes(n)) sc=150;
    else if(hayOf(b).includes(n)) sc=60;
    if(sc) out.push({b,sc});
  }
  return out.sort((x,y)=>y.sc-x.sc||x.b.rank2-y.b.rank2).map(x=>({b:x.b,name:x.sc>=150}));
}

function match(b, st){
  if(st.f && st.f.some(k=>!b.f.includes(k))) return false;
  if(st.origin && st.origin.length && !st.origin.includes(b.origin)) return false;
  if(st.type && st.type.length && !st.type.includes(b.type)) return false;
  if(st.buy && st.buy.length && !st.buy.includes(b.buy)) return false;
  if(st.q){ const q=norm(st.q); if(!(norm(b.en).includes(q)||norm(b.ko).includes(q)||hayOf(b).includes(q))) return false; }
  return true;
}
function sorted(list, how){
  const a=[...list];
  if(how==='name') return a.sort((x,y)=>x.en.localeCompare(y.en));
  if(how==='kr') return a.sort((x,y)=>(x.origin==='국내'?0:1)-(y.origin==='국내'?0:1)||x.rank2-y.rank2);
  return a.sort((x,y)=>x.rank2-y.rank2);
}

}

function initials(b){ const w=b.en.replace(/[^A-Za-z0-9 ]/g,' ').trim().split(/\s+/); return (w.length>1?w[0][0]+w[1][0]:b.en.replace(/[^A-Za-z0-9]/g,'').slice(0,2)).toUpperCase(); }
function thumb(b, cls='thumb'){

function covGrid(b){

/* ---------- quiz ---------- */
function quizScore(b,a){
  const [g,sp,fit]=a; let s=0; const why=[]; const W=T().why;
  if(g==='m'&&!b.f.includes('남성')) return null;
  if(g==='w'&&!b.f.includes('여성')) return null;
  if(g!=='a') why.push(W.gender);
  if(sp==='bb'){ const hit=/보디빌딩|웨이트/.test(b.sport)||b.f.includes('펌프커버/헤비웨이트'); if(hit){s+=3;why.push(W.bb);} if(['짐웨어 전문','짐 스트리트'].includes(b.type)) s+=1; }
  if(sp==='pl'){ if(b.f.includes('스트렝스/싱글렛')||b.type==='스트렝스 스포츠'){s+=5;why.push(W.pl);} else if(/웨이트리프팅|파워/.test(b.sport)) s+=2; }
  if(sp==='run'){ if(b.f.includes('러닝/HYROX/크로스트레이닝')){s+=5;why.push(W.run);} else if(b.type==='퍼포먼스 트레이닝') s+=2; }
  if(sp==='ath'){ if(b.type==='애슬레저'||b.f.includes('레깅스')){s+=3;why.push(W.ath);} if(/요가|필라테스/.test(b.sport)) s+=2; }
  const fm={muscle:'머슬핏',over:'오버핏',comp:'컴프레션'}[fit];
  if(fm && b.f.includes(fm)){ s+=3; why.push(W[fit]); }
  if(b.origin==='국내'||b.buy==='국내 공식몰'){ s+=0.5; if(why.length<3) why.push(W.kr); }
  s+=b.v2.total/50;
  return {b,s,why:why.slice(0,3)};
}

async function submitBrand(){
  const t=T(); const g=id=>document.getElementById(id).value.trim();

  const key=d.name.toLowerCase().replace(/[^a-z0-9가-힣]/g,'');
  const dup=BRANDS.find(b=>b.en.toLowerCase().replace(/[^a-z0-9]/g,'')===key||b.ko.replace(/\s/g,'')===key);

}

const app=document.getElementById('app');

  const t=T();

function render(){
  chrome();
  const h=(location.hash||'#home').slice(1);
  let key='home';
  if(h.startsWith('b-') && byId[h.slice(2)]){ app.innerHTML=viewDetail(byId[h.slice(2)]); key='brands'; }
  else if(h==='brands'){ const open=document.getElementById('fDetails')?.open; app.innerHTML=viewBrands(); key='brands'; document.getElementById('sort').value=S.sort; const d=document.getElementById('fDetails'); if(open===false || (open===undefined && matchMedia('(max-width:900px)').matches)) d.open=false; renderGrid(); }
  else if(h==='compare'){ app.innerHTML=viewCompare(); key='compare'; }
  else if(h==='quiz'){ app.innerHTML=viewQuiz(); key='quiz'; }
  else if(h==='submit'){ app.innerHTML=viewSubmit(); key='about'; }
  else if(h==='about'){ app.innerHTML=viewAbout(); key='about'; }
  else { app.innerHTML=viewHome(); updateFinder(); }
  document.querySelectorAll('[data-nav]').forEach(a=>{ if(a.dataset.nav===key) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  syncCmp();
}
function route(){
  const h=(location.hash||'#home').slice(1);
  if(h.startsWith('b-')&&byId[h.slice(2)]) track('brand_view',{brand:byId[h.slice(2)].en});
  if(h==='quiz'&&quiz.step===0) track('quiz_open');
  if(h!=='submit'){ subDone=null; }
  render(); window.scrollTo(0,0);
}
function updateFinder(){ const n=BRANDS.filter(b=>match(b,finder)).length; const el=document.getElementById('finderN'); if(el) el.textContent=n; }
function go(state){ S=Object.assign(emptyState(),JSON.parse(JSON.stringify(state))); track('filter_use',{filters:[...S.f,...S.origin,...S.type,...S.buy].join('|')}); if(location.hash==='#brands') route(); else location.hash='brands'; }

document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,label'); if(!t) return;
  if(t.dataset.track) track(t.dataset.track,{brand:t.dataset.brand});
  if(t.id==='langBtn'){ lang=lang==='ko'?'en':'ko'; try{localStorage.setItem('gb_lang',lang);}catch(x){} track('lang_switch'); render(); return; }
  if(t.dataset.cmp){ toggleCmp(t.dataset.cmp); return; }
  if(t.dataset.cmprm){ cmp=cmp.filter(x=>x!==t.dataset.cmprm); saveCmp(); render(); return; }
  if(t.id==='cmpClear'||t.id==='trayClear'){ cmp=[]; saveCmp(); if(location.hash==='#compare') render(); else syncCmp(); return; }
  if(t.classList.contains('ffilter')){ const k=t.dataset.k,v=t.dataset.v; finder[k]=finder[k].includes(v)?finder[k].filter(x=>x!==v):[...finder[k],v]; t.setAttribute('aria-pressed',finder[k].includes(v)); updateFinder(); return; }
  if(t.id==='finderReset'){ finder={f:[],origin:[]}; document.querySelectorAll('.ffilter').forEach(c=>c.setAttribute('aria-pressed','false')); updateFinder(); return; }
  if(t.id==='finderGo'){ go(finder); return; }
  if(t.dataset.preset){ go(PRESETS[+t.dataset.preset]); return; }
  if(t.dataset.cat!==undefined && t.classList.contains('cat')){ track('category_click',{category:CATS[+t.dataset.cat].origin?.[0]||CATS[+t.dataset.cat].type?.[0]||'women'}); go(CATS[+t.dataset.cat]); return; }
  if(t.classList.contains('sfilter')){ const k=t.dataset.k,v=t.dataset.v; S[k]=S[k].includes(v)?S[k].filter(x=>x!==v):[...S[k],v]; t.setAttribute('aria-pressed',S[k].includes(v)); track('filter_use',{filter:v}); renderGrid(); return; }
  if(t.dataset.remove){ const v=t.dataset.remove; ['f','origin','type','buy'].forEach(k=>S[k]=S[k].filter(x=>x!==v)); document.querySelectorAll(`.sfilter[data-v="${CSS.escape(v)}"]`).forEach(c=>c.setAttribute('aria-pressed','false')); renderGrid(); return; }
  if(t.hasAttribute('data-clearall')){ const sort=S.sort; S=emptyState(); S.sort=sort; render(); return; }
  if(t.dataset.ans){ quiz.a[quiz.step]=t.dataset.ans; quiz.step++; if(quiz.step===3) track('quiz_complete',{answers:quiz.a.join('|')}); render(); window.scrollTo(0,0); return; }
  if(t.id==='qBack'){ quiz.step=Math.max(0,quiz.step-1); render(); return; }
  if(t.id==='qRetry'){ quiz={step:0,a:[]}; render(); window.scrollTo(0,0); return; }
  if(t.id==='qAll'){ const [g,,fit]=quiz.a; const f=[]; if(g==='m')f.push('남성'); if(g==='w')f.push('여성'); const fm={muscle:'머슬핏',over:'오버핏',comp:'컴프레션'}[fit]; if(fm)f.push(fm); const sp={pl:'스트렝스/싱글렛',run:'러닝/HYROX/크로스트레이닝'}[quiz.a[1]]; if(sp)f.push(sp); go({f}); return; }
  if(t.id==='qCopy'){ copyText(document.getElementById('shareTxt').textContent); track('quiz_share_copy'); return; }
  if(t.id==='dmCopy'){ copyText(document.getElementById('dmTxt').textContent); return; }
  if(t.id==='subAgain'){ subDone=null; render(); return; }
  if(t.dataset.rmimg){ removeImg(t.dataset.rmimg); return; }
});
document.addEventListener('submit',e=>{ if(e.target.id==='subForm'){ e.preventDefault(); submitBrand(); } });
document.addEventListener('input',e=>{ if(e.target.id==='q'){ S.q=e.target.value.trim(); renderGrid(); logSearch(S.q,BRANDS.filter(b=>match(b,S)).length); } });
document.addEventListener('change',e=>{
  if(e.target.id==='sort'){ S.sort=e.target.value; renderGrid(); }
  if(e.target.id==='imgIn' && e.target.files[0]) uploadImg(e.target.dataset.brand, e.target.files[0]);
});
function sresHTML(q){
  const t=T(), n=norm(q);
  if(!n){ return `<div class="sres-h">${t.sHot}</div><div class="hot in">${(lang==='en'?HOT_Q_EN:HOT_Q).map(w=>`<button type="button" class="hotq" data-q="${esc(w)}">${esc(w)}</button>`).join('')}</div>`; }
  const r=searchBrands(q);
  if(!r.length) return `<p class="snone">${esc(t.sNone(q))}</p>`;
  return r.slice(0,7).map(({b,name})=>`<a class="srow" href="#b-${b.id}" data-sres="${esc(b.en)}">${thumb(b,'thumb sm')}<span class="sname"><b>${esc(b.en)}</b><small>${esc(b.ko)} · ${esc(trOne(b.origin))} · ${esc(trOne(b.type))}</small></span><span class="stag">${name?t.sTagN:t.sTagM}</span><span class="srk">${T().rank(b.rank2,false)}</span></a>`).join('')
    + `<button type="button" class="sall" data-sall="${esc(q)}">${t.sAll(r.length)}</button>`;
}
let sTimer=null;
function logSearch(q,n){ clearTimeout(sTimer); if(norm(q).length<2) return; sTimer=setTimeout(()=>track('search',{search_term:q,results:n}),900); }
function searchAll(q){ closeSearch(); const st=emptyState(); st.q=q.trim(); track('search_submit',{search_term:st.q,results:searchBrands(st.q).length}); go(st); }
function openSearch(q){ const o=document.getElementById('sOver'), i=document.getElementById('gq'); i.placeholder=T().sPh; i.value=q||''; document.getElementById('gres').innerHTML=sresHTML(i.value); o.hidden=false; document.documentElement.style.overflow='hidden'; setTimeout(()=>i.focus(),20); track('search_open'); }
function closeSearch(){ const o=document.getElementById('sOver'); if(o.hidden) return; o.hidden=true; document.documentElement.style.overflow=''; }
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,.sover'); if(!t) { const h=document.getElementById('hres'); if(h && !e.target.closest('#hForm')) h.hidden=true; return; }
  if(t.id==='sOpen'){ openSearch(''); return; }
  if(t.id==='sClose' || t.id==='sOver' && e.target===t){ closeSearch(); return; }
  if(t.dataset.q!==undefined){ const box=t.closest('#sOver'); if(box){ const i=document.getElementById('gq'); i.value=t.dataset.q; document.getElementById('gres').innerHTML=sresHTML(i.value); i.focus(); } else searchAll(t.dataset.q); return; }
  if(t.dataset.sall!==undefined){ searchAll(t.dataset.sall); return; }
  if(t.dataset.sres){ track('search_result_click',{brand:t.dataset.sres}); closeSearch(); return; }
  const h=document.getElementById('hres'); if(h && !e.target.closest('#hForm')) h.hidden=true;
});
document.addEventListener('input',e=>{
  if(e.target.id==='gq'){ const v=e.target.value; document.getElementById('gres').innerHTML=sresHTML(v); logSearch(v,searchBrands(v).length); }
  if(e.target.id==='hq'){ const v=e.target.value, h=document.getElementById('hres'); h.innerHTML=sresHTML(v); h.hidden=!norm(v); logSearch(v,searchBrands(v).length); }
});
document.addEventListener('submit',e=>{ if(e.target.id==='hForm'){ e.preventDefault(); const v=document.getElementById('hq').value; if(norm(v)) searchAll(v); } });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeSearch(); const h=document.getElementById('hres'); if(h) h.hidden=true; }
  if(e.key==='Enter' && e.target.id==='gq'){ e.preventDefault(); if(norm(e.target.value)) searchAll(e.target.value); }
  if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){ e.preventDefault(); openSearch(''); }
});
document.addEventListener('focusin',e=>{ if(e.target.id==='hq'){ const h=document.getElementById('hres'); if(norm(e.target.value)){ h.innerHTML=sresHTML(e.target.value); h.hidden=false; } } });
window.addEventListener('hashchange',()=>closeSearch());
window.addEventListener('hashchange',route);
route();

/* ---------- images & submissions (light up when the viewer supports them) ---------- */
async function uploadImg(id, file){
  const t=T(); flash(t.uploading);
  try{
    const r=await ASSETS.upload(file);
    const old=IMGS[id];
    await DB.doc('brandimg/'+id).set({asset:r.id, at:new Date().toISOString()});
    IMGS={...IMGS,[id]:r.id};
    if(old) ASSETS.delete(old).catch(()=>{});
    render();
  }catch(e){ flash(t.upFail); }
}
async function removeImg(id){
  const old=IMGS[id]; if(!old) return;
  try{ await DB.doc('brandimg/'+id).delete(); const n={...IMGS}; delete n[id]; IMGS=n; ASSETS.delete(old).catch(()=>{}); render(); }catch(e){ flash(T().upFail); }
}
(async()=>{
  if(!window.claude?.use) return;
  try{ DB=await window.claude.use('db'); }catch(e){ DB=null; }
  try{ USER=await window.claude.use('user'); }catch(e){ USER=null; }
  try{ ASSETS=await window.claude.use('assets'); }catch(e){ ASSETS=null; }
  try{ canEditFlag = USER ? !!(await USER.canEdit()) : false; }catch(e){ canEditFlag=false; }
  if(!DB) return;
  DB.collection('brandimg').onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{ const v=d.data(); if(v&&typeof v.asset==='string'&&/^[0-9a-f]{32}$/.test(v.asset)) m[d.id]=v.asset; });
    if(JSON.stringify(m)!==JSON.stringify(IMGS)){ IMGS=m; const a=document.activeElement; if(!(a&&a.id==='q')) render(); else renderGrid(); }
  },()=>{});
  if(canEditFlag){
    DB.collection('submissions').orderBy('at','desc').limit(200).onSnapshot(snap=>{
      SUBS=snap.docs.map(d=>d.data()); if(location.hash==='#submit' && !document.getElementById('subForm')?.contains(document.activeElement)) render();
    },()=>{});
  }
  if(ASSETS && /^#b-/.test(location.hash)) render();
})();
</script>
