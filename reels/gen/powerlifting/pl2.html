const PO2={
 clapA:{h:[2,-168],n:[0,-150],p:[0,-92],le:[16,-128],lh:[22,-118],re:[-12,-128],rh:[-16,-112],lk:[6,-48],lf:[10,-2],rk:[-6,-48],rf:[-10,-2]},

function warm(kind,t){ const w=Math.sin(t*Math.PI*2*2.2);
  if(kind==='chalk') return mix(PO2.clapA,PO2.clapB,(w+1)/2);

}
function shirt(g,x,y,h,J,name,col){ const u=h/180; const nx=x+J.n[0]*u, ny=y+J.n[1]*u, px=x+J.p[0]*u, py=y+J.p[1]*u; const cx=(nx+px)/2, cy=(ny+py)/2+4*u, ang=Math.atan2(py-ny,px-nx)-Math.PI/2;

function frame(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.filter='none'; ctx.globalAlpha=1; ctx.letterSpacing='0px';
  let ph,lt,sl; if(t<INTRO){ph='intro';lt=t;sl=INTRO;} else if(t<INTRO+SEG*4){const i=Math.floor((t-INTRO)/SEG);ph=i;lt=t-INTRO-i*SEG;sl=SEG;} else if(t<INTRO+SEG*4+LAST){ph=4;lt=t-INTRO-SEG*4;sl=LAST;} else {ph='end';lt=t-INTRO-SEG*4-LAST;sl=END;}
  const LV=ph==='intro'?0:ph==='end'?1:ph/4;
  const z=1+.035*(lt/sl); ctx.save(); ctx.translate(W/2,H*.6); ctx.scale(z,z); ctx.translate(-W/2,-H*.6);
  ctx.drawImage(BG,0,0); const rim=spot(LV);

    else { J=PO.lock; if(ph===4&&lt>3.3){ J=mix(PO.lock,PO.win,ease(cl((lt-3.3)/.4,0,1))); bar=false; } }

  T('BASECAMP RANK · EP.'+D.ep,70,200,`600 24px ${EN}`,PT,'left',8);
  if(ph==='intro'){ const ls=[['파워리프팅 운동복',0],['브랜드 5명의',0],['최고 기록전',1]]; ls.forEach(([w,hl],i)=>{ const a=cl((lt-.15-i*.3)/.25,0,1); if(!a) return; ctx.globalAlpha=a; ctx.shadowColor='#000'; ctx.shadowBlur=40; T(w,70,330+i*120,`700 104px ${SERIF}`,hl?PT:'#F4EFE8'); ctx.shadowBlur=0; ctx.globalAlpha=1; });
    const a=cl((lt-1.3)/.4,0,1); ctx.globalAlpha=a; T('규칙: 점수 × 4 = 들어 올리는 무게',70,720,`500 34px ${KR}`,'#ddd3c9'); ctx.globalAlpha=1; lineup(0,-1); }
  else if(ph==='end'){ const a=cl(lt/.5,0,1); ctx.fillStyle=`rgba(0,0,0,${.5*a})`; ctx.fillRect(0,0,W,H); ctx.globalAlpha=a; T('GYM BASECAMP',W/2,420,`600 28px ${EN}`,PT,'center',10); ctx.shadowColor='#000'; ctx.shadowBlur=40; T('운동복,',W/2,580,`700 120px ${SERIF}`,'#F4EFE8','center'); ctx.font=`700 120px ${SERIF}`; const w1=ctx.measureText('감 말고 ').width,w2=ctx.measureText('점수로.').width,x0=W/2-(w1+w2)/2; T('감 말고 ',x0,720,`700 120px ${SERIF}`,'#F4EFE8'); T('점수로.',x0+w1,720,`700 120px ${SERIF}`,PT); ctx.shadowBlur=0; const b=cl((lt-.6)/.4,0,1); ctx.globalAlpha=b; T('내 운동에 맞는 정상 찾기',W/2,830,`500 36px ${KR}`,'#ddd3c9','center'); T('gymbasecamp.kr',W/2,890,`700 44px ${EN}`,'#fff','center'); ctx.globalAlpha=1; lineup(5,-1); }
  else { const it=IT[ph]; const a0=cl(lt/.3,0,1); ctx.globalAlpha=a0; T(`LIFTER ${ph+1} / 5`,70,300,`600 28px ${EN}`,PT,'left',8);
    let fs=110; ctx.font=`300 ${fs}px ${EN}`; ctx.letterSpacing='10px'; while(ctx.measureText(it.en).width>W-140&&fs>60){fs-=4;ctx.font=`300 ${fs}px ${EN}`;} T(it.en,66,420,`300 ${fs}px ${EN}`,'#F4EFE8','left',10);
    T(`${it.ko}${it.ig?'  ·  '+it.ig:''}`,72,480,`500 32px ${KR}`,'#d9d1c8'); ctx.globalAlpha=1;
    if(pop>0){ const kg=(it.s*4).toFixed(1); const sc=1+.6*Math.pow(1-ease(pop),2); ctx.save(); ctx.translate(W/2,760); ctx.scale(sc,sc); ctx.globalAlpha=pop; ctx.shadowColor=PT; ctx.shadowBlur=60; T(kg,0,40,`800 200px ${EN}`,'#fff','center',-4); ctx.shadowBlur=0; T(`KG  ·  GOOD LIFT  ·  ${it.s}점`,0,110,`700 40px ${EN}`,PT,'center',6); ctx.restore(); ctx.globalAlpha=1;
      const b=cl((lt-2.8)/.3,0,1); if(b){ ctx.globalAlpha=b; T(`${it.r}위`,W/2,610,`700 64px ${SERIF}`,it.r===1?PT:'#F4EFE8','center'); ctx.globalAlpha=1; } }
